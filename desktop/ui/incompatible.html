<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>需要更新客户端</title>
    <style>
      :root { color-scheme: light; font-family: "Microsoft YaHei UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #14213d; background: #f4f8ff; }
      main { width: min(520px, calc(100vw - 48px)); padding: 36px; border: 1px solid #dce6f5; border-radius: 8px; background: #fff; box-shadow: 0 12px 32px rgb(30 65 120 / 8%); }
      .code { color: #165dff; font-size: 13px; font-weight: 700; }
      h1 { margin: 10px 0 0; font-size: 24px; }
      p { margin: 14px 0 0; color: #5f6b7a; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">客户端状态 E-CLIENT-INCOMPATIBLE</div>
      <h1>当前客户端版本需要更新</h1>
      <p>为保证业务与安全策略一致，请联系系统管理员安装已批准的新版本。</p>
    </main>
  </body>
</html>
