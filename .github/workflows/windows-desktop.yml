name: Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install root dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Run backend tests
        run: python -m unittest discover -s server/tests -v
      - name: Run frontend contract verification
        run: |
          npm run test:premium-theme
          npm run test:desktop-settings
          npm run test:desktop-sync-ui
      - name: Build web application
        run: npm run build
      - name: Verify desktop application
        run: npm --prefix desktop run verify

  internal-test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Build internal-test installer
        env:
          DESKTOP_RELEASE_CHANNEL: internal-test
          DESKTOP_SERVER_URL: ${{ vars.DESKTOP_TEST_URL }}
        run: |
          node desktop/scripts/validate-release-configuration.mjs
          npm --prefix desktop run dist:win
          npm --prefix desktop run verify:package
      - name: Upload internal-test installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JiqingERP-internal-test-${{ github.run_number }}
          path: desktop/dist/JiqingERP-*-Setup.exe
          if-no-files-found: error

  production:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    needs: verify
    environment:
      name: production
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Validate production tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^desktop-v\d+\.\d+\.\d+$') {
            throw 'Production tag must match desktop-v<major>.<minor>.<patch>'
          }
      - name: Build and verify signed production installer
        env:
          DESKTOP_RELEASE_CHANNEL: production
          DESKTOP_SERVER_URL: ${{ vars.DESKTOP_PRODUCTION_URL }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_EXPECTED_SIGNER_SHA256: ${{ vars.WINDOWS_EXPECTED_SIGNER_SHA256 }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'jiqing-desktop-signing.pfx'
          try {
            node desktop/scripts/validate-release-configuration.mjs
            $certificateBytes = [Convert]::FromBase64String(
              $env:WINDOWS_CERTIFICATE_BASE64
            )
            [System.IO.File]::WriteAllBytes(
              $certificatePath,
              $certificateBytes
            )
            $env:CSC_LINK = $certificatePath
            $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
            npm --prefix desktop run dist:production
            npm --prefix desktop run verify:package
            node desktop/scripts/verify-windows-signatures.mjs
          } finally {
            $env:CSC_LINK = $null
            $env:CSC_KEY_PASSWORD = $null
            Remove-Item -LiteralPath $certificatePath `
              -Force -ErrorAction SilentlyContinue
          }
      - name: Upload signed production installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: JiqingERP-production-${{ github.ref_name }}
          path: desktop/dist/JiqingERP-*-Setup.exe
          if-no-files-found: error
